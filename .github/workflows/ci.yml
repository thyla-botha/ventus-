name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Tenancy lint
        run: pnpm lint:tenancy

      - name: Schema-store drift lint
        run: pnpm lint:schema-store

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
